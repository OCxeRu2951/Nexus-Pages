    .version-list { display: flex; flex-direction: column; gap: 32px; margin-top: 32px; }

    .version-block {
      position: relative;
      padding-left: 28px;
      border-left: 2px solid var(--border);
    }
    .version-block::before {
      content: '';
      position: absolute;
      left: -7px; top: 4px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
    }
    .version-block.latest::before {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(240,120,48,0.2);
    }

    .version-header {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .version-tag {
      font-family: monospace; font-size: 20px; font-weight: 800;
      color: var(--text);
    }
    .version-badge {
      font-size: 11px; font-family: monospace; font-weight: 700;
      padding: 2px 10px; border-radius: 10px;
      background: var(--accent); color: #fff;
      letter-spacing: 0.5px;
    }
    .version-date {
      font-size: 13px; color: var(--muted); font-family: monospace;
    }
    .version-title {
      font-size: 14px; color: var(--text2); margin-bottom: 16px;
    }

    .change-section { margin-bottom: 14px; }
    .change-section:last-child { margin-bottom: 0; }
    .change-section-label {
      display: inline-block;
      font-size: 11px; font-family: monospace; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      padding: 2px 8px; border-radius: 4px;
      margin-bottom: 8px;
    }
    .label-added   { background: rgba(46,204,113,0.15); color: #2ecc71; }
    .label-changed { background: rgba(52,152,219,0.15); color: #3498db; }
    .label-fixed   { background: rgba(231,76,60,0.15);  color: #e74c3c; }

    .change-list {
      list-style: none;
      display: flex; flex-direction: column; gap: 6px;
    }
    .change-list li {
      font-size: 14px; color: var(--text2); line-height: 1.6;
      padding-left: 16px; position: relative;
    }
    .change-list li::before {
      content: '—';
      position: absolute; left: 0; color: var(--muted);
    }
    .change-list code {
      font-family: monospace; font-size: 12px;
      background: var(--bg3); padding: 1px 6px; border-radius: 4px;
      color: var(--accent);
    }

    .sub-list {
      list-style: none;
      margin-top: 4px; margin-left: 16px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .sub-list li {
      font-size: 13px; color: var(--muted); padding-left: 14px; position: relative;
    }
    .sub-list li::before {
      content: '·';
      position: absolute; left: 0;
    }

  const SECTION_LABEL = {
    ja: { added: '追加', changed: '変更', fixed: '修正' },
    en: { added: 'Added', changed: 'Changed', fixed: 'Fixed' },
  };

  function getLang() { return localStorage.getItem('lang') || 'ja'; }

  function renderChangelog() {
    const lang = getLang();
    const versions = CHANGELOG[lang];
    const labels = SECTION_LABEL[lang];

    const html = versions.map(v => {
      const sectionsHtml = v.sections.map(section => {
        const itemsHtml = section.items.map(item => {
          const subHtml = item.sub
            ? `<ul class="sub-list">${item.sub.map(s => `<li>${s}</li>`).join('')}</ul>`
            : '';
          return `<li>${item.text}${subHtml}</li>`;
        }).join('');

        return `
          <div class="change-section">
            <span class="change-section-label label-${section.type}">${labels[section.type]}</span>
            <ul class="change-list">${itemsHtml}</ul>
          </div>`;
      }).join('');

      return `
        <div class="version-block ${v.latest ? 'latest' : ''}">
          <div class="version-header">
            <span class="version-tag">${v.version}</span>
            ${v.latest ? `<span class="version-badge">${lang === 'ja' ? '最新' : 'Latest'}</span>` : ''}
            ${v.date ? `<span class="version-date">${v.date}</span>` : ''}
          </div>
          <p class="version-title">${v.title}</p>
          ${sectionsHtml}
        </div>`;
    }).join('');

    document.getElementById('versionList').innerHTML = html;
  }

  document.addEventListener('langChanged', renderChangelog);
  document.addEventListener('DOMContentLoaded', renderChangelog);
  </script>
</body>
</html>

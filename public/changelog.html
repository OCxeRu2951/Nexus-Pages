<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Changelog — Nexus Bot</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    .hero { padding: 64px 0 48px; }
    .hero h1 { font-size: clamp(28px,5vw,42px); font-weight:800; margin-bottom:8px; }
    .hero .meta { font-size:13px; color:var(--muted); font-family:monospace; margin-top:8px; }

    .version-list { display: flex; flex-direction: column; gap: 32px; margin-top: 40px; }

    .version-block {
      position: relative;
      padding-left: 28px;
      border-left: 2px solid var(--border);
    }
    .version-block::before {
      content: '';
      position: absolute;
      left: -7px; top: 4px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
    }
    .version-block.latest::before {
      box-shadow: 0 0 0 4px rgba(240,120,48,0.2);
    }

    .version-header {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .version-tag {
      font-family: monospace; font-size: 20px; font-weight: 800;
      color: var(--text);
    }
    .version-badge {
      font-size: 11px; font-family: monospace; font-weight: 700;
      padding: 2px 10px; border-radius: 10px;
      background: var(--accent); color: #fff;
      letter-spacing: 0.5px;
    }
    .version-date {
      font-size: 13px; color: var(--muted); font-family: monospace;
    }
    .version-title {
      font-size: 14px; color: var(--text2); margin-bottom: 16px;
    }

    .change-section { margin-bottom: 14px; }
    .change-section:last-child { margin-bottom: 0; }
    .change-section-label {
      display: inline-block;
      font-size: 11px; font-family: monospace; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      padding: 2px 8px; border-radius: 4px;
      margin-bottom: 8px;
    }
    .label-added   { background: rgba(35,165,90,0.15);  color: var(--success); }
    .label-changed { background: rgba(74,138,240,0.15); color: var(--accent2); }
    .label-fixed   { background: rgba(242,63,66,0.15);  color: var(--danger); }

    .change-list {
      list-style: none;
      display: flex; flex-direction: column; gap: 6px;
    }
    .change-list li {
      font-size: 14px; color: var(--text2); line-height: 1.6;
      padding-left: 16px; position: relative;
    }
    .change-list li::before {
      content: '—';
      position: absolute; left: 0; color: var(--muted);
    }
    .change-list code {
      font-family: monospace; font-size: 12px;
      background: var(--bg3); padding: 1px 6px; border-radius: 4px;
      color: var(--accent);
    }

    .sub-list {
      list-style: none;
      margin-top: 4px; margin-left: 16px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .sub-list li {
      font-size: 13px; color: var(--muted); padding-left: 14px; position: relative;
    }
    .sub-list li::before {
      content: '·';
      position: absolute; left: 0;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo"><span>[</span>Nexus<span>]</span></a>
      <ul class="nav-links">
        <li><a href="/install">Install</a></li>
        <li><a href="/apply-status">Apply Status</a></li>
        <li><a href="/changelog" class="active">Changelog</a></li>
        <li><a href="/terms">Terms</a></li>
        <li><a href="/privacy">Privacy</a></li>
        <li><a href="/feedback">Feedback</a></li>
      </ul>
      <div class="nav-actions">
        <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀</button>
      </div>
    </div>
  </nav>

  <main>
    <div class="container" style="max-width: 760px">
      <div class="hero fade-up">
        <p class="label">Changelog</p>
        <div data-lang="ja" class="active">
          <h1>更新履歴</h1>
          <p class="meta">Nexus Botの新機能・修正内容を記録しています</p>
        </div>
        <div data-lang="en">
          <h1>Changelog</h1>
          <p class="meta">A record of new features and fixes for Nexus Bot</p>
        </div>
      </div>

      <div class="version-list fade-up" id="versionList"></div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 OCxeRu2951 · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="https://github.com/OCxeRu2951/DiscordBot-Nexus">GitHub</a></p>
  </footer>

  <script src="shared.js"></script>
  <script>
  const CHANGELOG = {
    ja: [
      {
        version: 'v0.9.0',
        date: '2026-08-10',
        title: 'ダイス/TRPGエンジン & Prefix権限システム',
        latest: true,
        sections: [
          {
            type: 'added',
            items: [
              {
                text: 'ダイス/TRPG判定エンジンを追加',
                sub: [
                  '<code>/dice</code> にTRPGモード（<code>system:coc7</code> / <code>coc6</code> / <code>dnd5e</code>）を追加',
                  'CoC7版：6段階の成功度、ボーナス/ペナルティダイス対応',
                  'CoC6版：4段階の成功度',
                  'D&D 5e：通常/有利/不利判定、ナチュラル20/1表示',
                ],
              },
              {
                text: '<code>r!</code> / <code>d!</code> プレフィックスコマンドを追加',
                sub: [
                  '複数グループのダイス式（最大3グループ、加減算のみ）— Prefix限定',
                  'TRPG短縮構文：<code>r!coc7 60</code>、<code>r!dnd +5 adv</code> 等',
                  '全角入力に対応（<code>ｒ！２ｄ６</code> 等）',
                ],
              },
              { text: '<code>/dice-prefix</code> — サーバー/チャンネル別のPrefix使用権限管理を追加' },
              { text: '<code>/language</code> — 個人用のBot返答言語設定を追加' },
            ],
          },
          {
            type: 'changed',
            items: [
              { text: '言語解決の優先順位を「ユーザー設定 → サーバー設定 → Discordのlocale → 英語」に変更' },
              { text: 'コマンドオプションの説明文も含めて完全ローカライズ対応' },
            ],
          },
          {
            type: 'fixed',
            items: [
              { text: '<code>/dice show_odds:true</code> でEmbed文字数上限を超過し無応答になる不具合を修正' },
              { text: '<code>/modhistory</code> の履歴件数に上限がなかった問題を修正' },
            ],
          },
        ],
      },
      {
        version: 'v0.8.0',
        date: '',
        title: 'モデレーションスイート',
        sections: [
          {
            type: 'added',
            items: [
              { text: 'モデレーションコマンド一式（warn/kick/ban/timeout/lock/role/note等）を追加' },
              { text: '警告ポイントしきい値による自動アクション（キック/BAN/タイムアウト）を追加' },
            ],
          },
        ],
      },
      {
        version: 'v0.7.0',
        date: '',
        title: '申請システム',
        sections: [
          {
            type: 'added',
            items: [
              { text: '<code>!apply</code> / <code>!revoke</code> による申請・募集ワークフローを追加' },
              { text: '承認/拒否ボタンと申請者へのDM通知を追加' },
            ],
          },
        ],
      },
    ],
    en: [
      {
        version: 'v0.9.0',
        date: '2026-08-10',
        title: 'Dice/TRPG Engine & Prefix Permission System',
        latest: true,
        sections: [
          {
            type: 'added',
            items: [
              {
                text: 'Added a Dice/TRPG check engine',
                sub: [
                  'Added TRPG mode to <code>/dice</code> (<code>system:coc7</code> / <code>coc6</code> / <code>dnd5e</code>)',
                  'CoC 7th: 6-tier success degrees, Bonus/Penalty dice',
                  'CoC 6th: 4-tier success degrees',
                  'D&D 5e: normal/advantage/disadvantage, Natural 20/1 indicator',
                ],
              },
              {
                text: 'Added <code>r!</code> / <code>d!</code> prefix commands',
                sub: [
                  'Multi-group dice expressions (up to 3 groups, +/- only) — prefix-only',
                  'TRPG shorthand syntax: <code>r!coc7 60</code>, <code>r!dnd +5 adv</code>, etc.',
                  'Full-width input support (e.g. <code>ｒ！２ｄ６</code>)',
                ],
              },
              { text: 'Added <code>/dice-prefix</code> — per-server/channel prefix permission management' },
              { text: 'Added <code>/language</code> — personal Bot response language setting' },
            ],
          },
          {
            type: 'changed',
            items: [
              { text: 'Language resolution priority changed to: user setting → server setting → Discord locale → English' },
              { text: 'Command option descriptions are now fully localized, not just top-level descriptions' },
            ],
          },
          {
            type: 'fixed',
            items: [
              { text: 'Fixed <code>/dice show_odds:true</code> silently failing when exceeding Discord\'s Embed field character limit' },
              { text: 'Fixed <code>/modhistory</code> having no upper limit on displayed history entries' },
            ],
          },
        ],
      },
      {
        version: 'v0.8.0',
        date: '',
        title: 'Moderation Suite',
        sections: [
          {
            type: 'added',
            items: [
              { text: 'Added full moderation command set (warn/kick/ban/timeout/lock/role/note, etc.)' },
              { text: 'Added automatic action (kick/ban/timeout) on warning point threshold' },
            ],
          },
        ],
      },
      {
        version: 'v0.7.0',
        date: '',
        title: 'Application System',
        sections: [
          {
            type: 'added',
            items: [
              { text: 'Added <code>!apply</code> / <code>!revoke</code> application/recruitment workflow' },
              { text: 'Added approve/reject buttons with applicant DM notifications' },
            ],
          },
        ],
      },
    ],
  };

  const SECTION_LABEL = {
    ja: { added: '追加', changed: '変更', fixed: '修正' },
    en: { added: 'Added', changed: 'Changed', fixed: 'Fixed' },
  };

  function getChangelogLang() {
    return localStorage.getItem('lang') || 'ja';
  }

  function renderChangelog() {
    const lang = getChangelogLang();
    const versions = CHANGELOG[lang];
    const labels = SECTION_LABEL[lang];

    const html = versions.map(v => {
      const sectionsHtml = v.sections.map(section => {
        const itemsHtml = section.items.map(item => {
          const subHtml = item.sub
            ? `<ul class="sub-list">${item.sub.map(s => `<li>${s}</li>`).join('')}</ul>`
            : '';
          return `<li>${item.text}${subHtml}</li>`;
        }).join('');

        return `
          <div class="change-section">
            <span class="change-section-label label-${section.type}">${labels[section.type]}</span>
            <ul class="change-list">${itemsHtml}</ul>
          </div>`;
      }).join('');

      return `
        <div class="version-block ${v.latest ? 'latest' : ''}">
          <div class="version-header">
            <span class="version-tag">${v.version}</span>
            ${v.latest ? `<span class="version-badge">${lang === 'ja' ? '最新' : 'Latest'}</span>` : ''}
            ${v.date ? `<span class="version-date">${v.date}</span>` : ''}
          </div>
          <p class="version-title">${v.title}</p>
          ${sectionsHtml}
        </div>`;
    }).join('');

    document.getElementById('versionList').innerHTML = html;
  }

  document.addEventListener('langChanged', renderChangelog);
  document.addEventListener('DOMContentLoaded', renderChangelog);
  </script>
</body>
</html>
